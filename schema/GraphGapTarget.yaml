title: GraphGapTarget
'@id': stencila:GraphGapTarget
nick: ggt
extends: Entity
category: flow
description: The structured scope of a graph limitation.
$comment: |
  Item qualifies the containing node, edge, evidence item or whole graph.
  Property requires a property path; Relationship requires an edge kind and a
  direction, and may name a role. Unused fields should be absent.
required: [kind]
properties:
  kind:
    '@id': stencila:kind
    description: Whether the limitation qualifies an item, property or relationship.
    $ref: GraphGapTargetKind
  property:
    '@id': stencila:property
    description: A property path, required for a Property target.
    type: string
  relationship:
    '@id': stencila:relationship
    description: The edge kind, required for a Relationship target.
    $ref: GraphEdgeKind
  direction:
    '@id': stencila:direction
    description: The edge direction relative to the containing item, required for a Relationship target.
    $ref: GraphGapDirection
  role:
    '@id': stencila:role
    description: An optional relationship role narrowing its scope.
    type: string
