title: GraphEvidence
'@id': stencila:GraphEvidence
nick: gev
extends: Entity
category: flow
description: Evidence from one independent evidentiary basis for a graph edge.
$comment: |
  This is an evidence type used in Stencila for graph edges.

  Each instance represents one independent reason for believing an edge exists,
  not one processing step used to discover or enrich that reason. Parsing,
  normalization, and locator resolution add context to the same evidence
  instance. For example, resolving an authored link does not add a second
  `Resolved` evidence item, and resolving an observed symbolic-link target does
  not add evidence separate from the observation.

  Multiple evidence items remain appropriate when genuinely independent bases
  support the same edge, such as an authored declaration and a separately
  inferred static relationship.

  The evidence metadata fields have distinct roles:

  - `codeLocation` is the exact location in source text where the evidence was
    found, such as a line and column in a code file, manifest, or document.
  - `source` is the evidence carrier or authority when it is not sufficiently
    described by `codeLocation.source`, such as an imported graph, attestation,
    external service, execution record, or user assertion.
  - `details` is for machine-readable detector-specific context that is not
    represented by core fields, such as parser rules, path expressions,
    dependency groups, package identifiers, or confidence inputs.
  - `description` is an optional human-readable fallback for display when a
    useful explanation cannot be derived from the structured fields.
required:
  - kind
core:
  - confidence
  - codeLocation
properties:
  kind:
    '@id': stencila:kind
    description: The kind of evidence.
    $ref: GraphEvidenceKind
  confidence:
    '@id': stencila:confidence
    description: The confidence in the evidence.
    $ref: GraphEvidenceConfidence
  codeLocation:
    '@id': stencila:codeLocation
    description: The exact location in source text where the evidence was found.
    $ref: CodeLocation
  source:
    '@id': stencila:source
    description: The evidence carrier or authority, when not sufficiently represented by the code location.
    anyOf:
      - $ref: ThingVariant
      - type: string
  recordedAt:
    '@id': stencila:recordedAt
    description: When this evidence was recorded.
    $ref: Timestamp
    strip: [timestamps]
  details:
    '@id': stencila:details
    description: Additional machine-readable details about the evidence.
    $ref: Object
  description:
    '@id': schema:description
    description: Optional human-readable explanation of the evidence.
    type: string
