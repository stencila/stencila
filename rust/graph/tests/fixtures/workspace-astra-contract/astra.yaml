version: "1.0"
name: ASTRA contract fixture
description: Exercises declarative ASTRA graph projection.
container: Containerfile

inputs:
  - id: catalog
    type: data
    source: data/catalog.csv
    description: Local observations.
  - id: calibration
    type: data
    source: https://example.org/calibration.csv
  - id: prior_analysis
    type: analysis
    ref: https://example.org/analyses/prior
    ref_version: "1.2"
    use_outputs: [baseline, diagnostics]

decisions:
  estimator:
    label: Estimator
    rationale: The estimator changes the fitted values.
    default: robust
    options:
      robust:
        label: Robust
      ordinary:
        label: Ordinary

outputs:
  - id: final_report
    from: report.summary

analyses:
  prepare:
    name: Prepare catalog
    inputs:
      - id: raw
        from: ../catalog
    decisions:
      estimator:
        from: ../estimator
    outputs:
      - id: cleaned
        type: data
        inputs: [raw]
        decisions: [estimator]
        recipe:
          command: python scripts/prepare.py --input {inputs.raw} --out {output}
          resources:
            cpus: 2

  model:
    name: Fit model
    inputs:
      - id: cleaned
        from: ../prepare.cleaned
      - id: remote_calibration
        from: ../calibration
      - id: prior
        from: ../prior_analysis
    decisions:
      estimator:
        from: ../estimator
    outputs:
      - id: fit
        type: table
        inputs: [cleaned, remote_calibration, prior]
        decisions: [estimator]
        when: [estimator.robust]
        recipe:
          command: python scripts/fit.py --out {output}
          container: ghcr.io/example/fitter:1.0
      - id: score
        type: metric
        inputs: [fit]
        recipe:
          command: python scripts/score.py --out {output}

  report:
    path: stages/report
