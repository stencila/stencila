[package]
name = "stencila-code-analysis-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ast-grep-config = "=0.42.3"
ast-grep-core = "=0.42.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stencila-format = { path = "../../format" }
tree-sitter-python = "=0.25.0"
tree-sitter-r = "=1.2.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-julia = "=0.23.1"
tree-sitter-matlab = "=1.3.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-snakemake = { git = "https://github.com/osthomas/tree-sitter-snakemake", tag = "v2.0.0" }
wasm-bindgen = "=0.2.121"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
