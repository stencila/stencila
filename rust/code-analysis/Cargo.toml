[package]
name = "stencila-code-analysis"
version = "0.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Pure static code analysis shared by native and WebAssembly consumers"

[dependencies]
ast-grep-config = "=0.42.3"
ast-grep-core = "=0.42.3"
serde = { workspace = true }
stencila-format = { path = "../format" }
tree-sitter = "=0.26.9"
tree-sitter-language = "=0.1.7"
tree-sitter-python = "=0.25.0"
tree-sitter-r = "=1.2.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-julia = "=0.23.1"
tree-sitter-matlab = "=1.3.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-snakemake = { version = "=2.0.0", git = "https://github.com/osthomas/tree-sitter-snakemake", rev = "7731408e5e8095fe242fdd423c3d3ae886fbf9fd" }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
eyre = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
