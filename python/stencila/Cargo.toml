[package]
name = "stencila-python"
version = "2.16.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import stencila`). If you change this, you must also change the name of the
# `#[pymodule]` in `src/lib.rs`.
name = "stencila"
doc = false

# "cdylib" is necessary to produce a shared library for Python to import from.
#
# Downstream Rust code (including code in `bin/`, `examples/`, and `tests/`) will not be able
# to `use stencila;` unless the "rlib" or "lib" crate type is also included, e.g.:
# crate-type = ["cdylib", "rlib"]
crate-type = ["cdylib"]

[dependencies]
eyre = { workspace = true }
pyo3 = { version = "0.28.2", features = ["extension-module"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
stencila-codecs = { path = "../../rust/codecs" }
stencila-content-credentials = { path = "../../rust/content-credentials" }
stencila-graph = { path = "../../rust/graph" }
stencila-node-compare = { path = "../../rust/node-compare" }
stencila-node-compare-report = { path = "../../rust/node-compare-report" }
stencila-schema = { path = "../../rust/schema" }
tokio = { workspace = true }
