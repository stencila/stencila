# Workflow for creating a release of the CLI

name: Release CLI

on:
  # Allow this workflow to be triggered by the `version.yml` workflow
  # or manually at https://github.com/stencila/stencila/actions/workflows/release-cli.yml
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to create the release for e.g. v2.1.0
        type: string
        required: true
      create-release:
        description: Create release
        type: boolean
        default: true
      build-cli:
        description: Build CLI
        type: boolean
        default: true
      platforms:
        description: "Platforms to build (comma-separated: ubuntu,macos-arm,windows)"
        type: string
        default: "ubuntu,macos-arm,windows"
      publish-docker:
        description: Build and Push Docker image
        type: boolean
        default: true
      publish-release:
        description: Publish release
        type: boolean
        default: true
      trigger-install:
        description: Trigger installation test workflow
        type: boolean
        default: true
      trigger-release-vsix:
        description: Trigger VSCode extension release workflow
        type: boolean
        default: true

jobs:
  # Create a draft release
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        # Needed only because `gh` errors if not in a repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Create release
        # Put `if` here (and not at higher level) because all subsequent jobs `need`
        # this one and so will not run if this one does not run
        if: ${{ inputs.create-release }}
        run: gh release create ${{ inputs.tag }} --title ${{ inputs.tag }} --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Use the same build as the manual pre-release check.
  build-cli:
    if: ${{ inputs.build-cli }}
    needs: [create-release]
    uses: ./.github/workflows/build-cli.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag }}
      platforms: ${{ inputs.platforms }}

  # Upload only after every requested platform has built successfully.
  upload-cli:
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Upload archives to release
        run: gh release upload "$RELEASE_TAG" artifacts/cli-* --repo "$GITHUB_REPOSITORY"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push Docker image
  # Based on https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
  publish-docker:
    if: ${{ inputs.publish-docker }}
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            stencila/stencila
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            stencila/stencila:latest
            stencila/stencila:${{ inputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publish the draft release
  # Wait for all packages to be published so that the `install.yml` workflow
  # that this triggers tests this release and not a previous version
  publish-release:
    if: ${{ inputs.publish-release }}
    needs: [upload-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        # Needed only because `gh` errors if not in a repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Mark release as non-draft
        run: gh release edit ${{ inputs.tag }} --draft=false

      - name: Trigger installation test workflow
        if: ${{ inputs.trigger-install }}
        run: sleep 90 && gh workflow run install-cli.yml

      - name: Trigger VSCode extension release workflow
        if: ${{ inputs.trigger-release-vsix }}
        run: gh workflow run release-vsix.yml -f tag=${{ inputs.tag }}
