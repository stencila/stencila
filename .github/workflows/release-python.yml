# Workflow for creating releases of Python packages

name: Release Python packages

on:
  # Allow this workflow to be triggered by the `version.yml` workflow
  # or manually at https://github.com/stencila/stencila/actions/workflows/release-python.yml
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to create the release for e.g. v2.1.0
        type: string
        required: true
      publish-types:
        description: Publish stencila_types on PyPI
        type: boolean
        default: true
      build-sdk:
        description: Build Python SDK wheels
        type: boolean
        default: true
      publish-sdk:
        description: Publish Python SDK
        type: boolean
        default: true
      trigger-install:
        description: Trigger the `install-python.yml` workflow
        type: boolean
        default: true

env:
  RUST_VERSION: "1.94.0"
  PYTHON_VERSION: "3.12"

jobs:
  # Publish stencila_types
  publish-types:
    runs-on: ubuntu-latest
    permissions:
      # This permission is required for PyPI trusted publishing
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish package
        # Put `if` here so that jobs that `need` this one will still
        # run even if this is not getting published
        if: ${{ inputs.publish-types }}
        run: cd python/stencila_types && uv build && uv publish && sleep 60

  # Build python/stencila package (Python SDK)
  # Based on https://github.com/messense/py-dissimilar/blob/main/.github/workflows/CI.yml
  build-sdk:
    if: ${{ inputs.build-sdk }}
    needs: [publish-types]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
            target: x64
          - os: macos-latest
            architecture: x64
            target: x64
          - os: macos-latest-xlarge
            architecture: arm64
            target: aarch64
          - os: windows-latest
            architecture: x64
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.architecture }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python/stencila
          target: ${{ matrix.target }}
          # Interpreters must be within the `requires-python` of `pyproject.toml`;
          # a wheel built for anything older is one that `pip` will never select.
          # Test changes to these args using the `build` recipe in the `python/Makefile`
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/stencila/dist

  # Publish Python SDK
  # This action should not checkout the repository because that adds other,
  # non-wheel files to the upload and thereby causes the upload to fail.
  publish-sdk:
    if: ${{ inputs.publish-sdk }}
    needs: [build-sdk]
    runs-on: ubuntu-latest
    permissions:
      # This permission is required for PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Necessary to avoid artifacts being extracted into separate folders
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: upload
          args: --skip-existing *

  # Trigger the install test workflow
  trigger-install:
    if: ${{ inputs.trigger-install }}
    needs: [publish-types, publish-sdk]
    runs-on: ubuntu-latest
    permissions:
        actions: write
    env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        # Needed only because `gh` errors if not in a repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Trigger installation test workflow
        # Sleep for a while to allow published Python packages
        # to be made available on PyPI before attempting to install them
        run: sleep 90 && gh workflow run install-python.yml
