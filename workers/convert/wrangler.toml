name = "convert"
compatibility_date = "2026-07-09"

routes = [{ pattern = "convert.stencila.dev", custom_domain = true }]

observability = { enabled = true }
send_metrics = false

main = "worker.ts"

[assets]
directory = "./public"
binding = "ASSETS"

[[containers]]
class_name = "ConvertBackend"
image = "../../Dockerfile.convert"
# Use "debug" after running `cargo build --bin stencila-convert-server` to
# copy the local debug binary into the image instead of compiling a release.
# image_vars = { CONVERT_SERVER_PROFILE = "debug" }
max_instances = 3
instance_type = "standard-1"

[[durable_objects.bindings]]
class_name = "ConvertBackend"
name = "CONVERT_BACKEND"

[[durable_objects.bindings]]
class_name = "ConvertRateLimitShard"
name = "RATE_LIMITER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConvertBackend", "ConvertRateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ConvertRateLimitShard"]
deleted_classes = ["ConvertRateLimiter"]

[[secrets_store_secrets]]
binding = "STENCILA_API_KEY_SECRET"
store_id = "16ab751279f34243945e79ab15842bc2"
secret_name = "CONVERT_STENCILA_API_KEY"
